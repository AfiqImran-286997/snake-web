<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport"
       content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
 <title>Snake — Scoreboard</title>
 <style>
   :root{ --bg:#163f5b; --panel:#0c2230; --bar:#0d2d40; --text:#fff; --muted:#a7d8ef; }
   html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
     font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
   header{ display:flex; gap:12px; align-items:center; justify-content:space-between;
     padding:10px 12px; background:var(--bar); border-bottom:1px solid rgba(255,255,255,.12); }
   .btn{ appearance:none; border:1px solid #2b506a; background:#0d2d40; color:#c8f1ff;
     padding:8px 12px; border-radius:10px; text-decoration:none; font-weight:700; }
   main{ max-width:900px; margin:18px auto; padding:0 12px; }
   .card{ background:var(--panel); border:1px solid rgba(255,255,255,0.1);
     border-radius:14px; padding:12px; }
   table{ width:100%; border-collapse:collapse; }
   th,td{ padding:10px; border-bottom:1px solid rgba(255,255,255,0.08); text-align:left; }
   th{ opacity:.9; font-weight:800; }
   .muted{ color:var(--muted); font-size:14px; }
   .footerRow td{ text-align:center; }
   #loadMore{ margin-top:12px; width:100%; }
   .hide{ display:none; }
 </style>
</head>
<body>
 <header>
   <div><strong>Snake — Scoreboard</strong></div>
   <a class="btn" href="index.html">Home</a>
 </header>

 <main>
   <p class="muted">
     Showing top scores for Snake. Your name is saved in your browser and attached to your scores.
   </p>

   <div class="card">
     <table>
       <thead>
         <tr><th>#</th><th>Name</th><th>Score</th><th>Date</th></tr>
       </thead>
       <tbody id="rows">
         <tr><td colspan="4" class="muted">Loading…</td></tr>
       </tbody>
     </table>
     <button id="loadMore" class="btn hide">Load more</button>
   </div>
 </main>

 <script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
   import {
     getFirestore, collection, query, where, orderBy, limit, getDocs, startAfter
   } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

   /* === SAME CONFIG AS index.html === */
   const firebaseConfig = {
     apiKey: "AIzaSyCB1IQNSy8pGFXgv9S1P4f0sTLyPxiUv9k",
     authDomain: "snake-web-b6745.firebaseapp.com",
     projectId: "snake-web-b6745",
     storageBucket: "snake-web-b6745.firebasestorage.app",
     messagingSenderId: "242732126109",
     appId: "1:242732126109:web:1d44c9bf8371f238792974"
   };

   /* ---------- DOM ---------- */
   const rowsEl = document.getElementById('rows');
   const loadMoreBtn = document.getElementById('loadMore');

   /* ---------- Helpers ---------- */
   const esc = s => String(s ?? "")
     .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

   const fmt = ts => {
     try { return ts?.toDate().toLocaleString() ?? "—"; }
     catch { return "—"; }
   };

   /* ---------- Pagination State ---------- */
   const PAGE_SIZE = 50;
   let app, db;
   let lastDoc = null;          // Firestore cursor
   let rankOffset = 0;          // continue numbering across pages
   let reachedEnd = false;      // no more docs

   /* ---------- Query builder (composite index) ---------- */
   const baseQuery = (cursor=null) => {
     // Requires composite index: game ASC, score DESC, created_at DESC
     const parts = [
       collection(db, "scores"),
       where("game","==","snake"),
       orderBy("score","desc"),
       orderBy("created_at","desc"),
       limit(PAGE_SIZE)
     ];
     if (cursor) parts.push(startAfter(cursor));
     return query(...parts);
   };

   /* ---------- Rendering ---------- */
   function appendRows(docs){
     // Remove "Loading…" if present
     if (rowsEl.firstElementChild && rowsEl.firstElementChild.children[0]?.textContent?.includes("Loading")) {
       rowsEl.innerHTML = "";
     }
     let html = "";
     docs.forEach((doc, i) => {
       const d = doc.data();
       html += `<tr>
         <td>${rankOffset + i + 1}</td>
         <td>${esc(d.name || "(anon)")}</td>
         <td>${d.score ?? 0}</td>
         <td>${fmt(d.created_at)}</td>
       </tr>`;
     });
     rowsEl.insertAdjacentHTML("beforeend", html);
     rankOffset += docs.length;
   }

   /* ---------- Data loaders ---------- */
   async function loadFirstPage(){
     rowsEl.innerHTML = `<tr><td colspan="4" class="muted">Loading…</td></tr>`;
     reachedEnd = false; lastDoc = null; rankOffset = 0;
     try{
       app = initializeApp(firebaseConfig);
       db  = getFirestore(app);

       const snap = await getDocs(baseQuery());
       if (snap.empty){
         rowsEl.innerHTML = `<tr><td colspan="4" class="muted">No scores yet.</td></tr>`;
         loadMoreBtn.classList.add("hide");
         return;
       }
       appendRows(snap.docs);
       lastDoc = snap.docs[snap.docs.length - 1];
       // If fewer than PAGE_SIZE came back, we already hit the end
       if (snap.size < PAGE_SIZE) { reachedEnd = true; loadMoreBtn.classList.add("hide"); }
       else { loadMoreBtn.classList.remove("hide"); }

     }catch(e){
       console.warn(e);
       rowsEl.innerHTML = `<tr><td colspan="4" class="muted">Failed to load scores.</td></tr>`;
       loadMoreBtn.classList.add("hide");
     }
   }

   async function loadMore(){
     if (reachedEnd || !lastDoc) return;
     loadMoreBtn.disabled = true;
     loadMoreBtn.textContent = "Loading…";
     try{
       const snap = await getDocs(baseQuery(lastDoc));
       if (snap.empty){ reachedEnd = true; loadMoreBtn.classList.add("hide"); return; }
       appendRows(snap.docs);
       lastDoc = snap.docs[snap.docs.length - 1];
       if (snap.size < PAGE_SIZE){ reachedEnd = true; loadMoreBtn.classList.add("hide"); }
     }catch(e){
       console.warn(e);
     }finally{
       loadMoreBtn.disabled = false;
       loadMoreBtn.textContent = "Load more";
     }
   }

   /* ---------- Init ---------- */
   loadMoreBtn.addEventListener('click', loadMore);
   loadFirstPage();
 </script>
</body>
</html>
