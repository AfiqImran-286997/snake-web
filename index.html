<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta
   name="viewport"
   content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
 />
 <title>Snake — Mobile Web + Firebase</title>
 <style>
   :root {
     --bg: #163f5b;
     --board: #327aa8;
     --snake: #00ff00;
     --food: #d53250;
     --poison: #a020f0;
     --gold: #ffd700;
     --ob: #a9a9a9;
     --text: #ffffff;
     --accent: #0d2d40;
     --safe-bottom: env(safe-area-inset-bottom, 0px);
   }
   html, body {
     margin: 0; padding: 0;
     height: 100dvh;
     overflow: hidden;              /* <- no scrolling */
     background: var(--bg);
     color: var(--text);
     font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
     touch-action: none;            /* prevent page gestures while playing */
     -webkit-user-select: none; user-select: none;
   }
   .wrap {
     height: 100dvh;
     display: grid;
     grid-template-rows: auto 1fr auto; /* header, game area, controls */
     justify-items: center;
     gap: 6px;
   }
   header {
     width: 100%;
     max-width: 900px;
     padding: 6px 10px;
     box-sizing: border-box;
     background: var(--accent);
     border-bottom: 1px solid rgba(255,255,255,0.12);
     border-radius: 0 0 12px 12px;
     display: flex;
     align-items: center;
     justify-content: space-between;
   }
   #hud { display: flex; gap: 10px; font-weight: 700; }
   #restartBtn {
     appearance: none; border: 0; cursor: pointer;
     padding: 8px 12px; border-radius: 10px;
     background: #22c55e; color: #052e14; font-weight: 800;
     box-shadow: 0 2px 0 #138a3d;
   }
   main {
     width: 100%;
     display: grid;
     place-items: center;
   }
   /* Canvas gets sized by JS; keep crisp pixels */
   #board { image-rendering: pixelated; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }

   /* Compact one-row control pad (always visible) */
   .pad {
     width: 100%;
     max-width: 900px;
     padding: 6px 10px calc(6px + var(--safe-bottom));
     box-sizing: border-box;
     display: flex;
     gap: 10px;
     justify-content: center;
     align-items: center;
   }
   .btn {
     width: clamp(56px, 16vw, 84px);
     height: clamp(56px, 16vw, 84px);
     border-radius: 14px;
     border: 0;
     background: #0ea5e9;
     color: white;
     font-size: clamp(18px, 5vw, 26px);
     font-weight: 900;
     display: grid; place-items: center;
     box-shadow: 0 6px 0 #0b6da0;
     touch-action: manipulation; cursor: pointer;
   }
   .btn:active { transform: translateY(2px); }

   /* Overlay */
   #overlay {
     position: fixed; inset: 0; z-index: 10;
     display: none; align-items: center; justify-content: center;
     background: rgba(0,0,0,0.6);
     padding: 16px;
   }
   .card {
     background: #0c2230;
     border: 1px solid rgba(255,255,255,0.1);
     border-radius: 16px;
     padding: 16px;
     width: min(520px, calc(100% - 24px));
     text-align: center;
     box-shadow: 0 10px 30px rgba(0,0,0,0.4);
   }
   .card h1 { margin: 0 0 8px; font-size: 22px; }
   .row { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
   .ghost { opacity: 0.8; font-size: 14px; }

 </style>
</head>
<body>
 <div class="wrap">
   <header>
     <div id="hud">
       <span id="score">Score: 0</span>
       <span id="time">Time: 60</span>
     </div>
     <button id="restartBtn" aria-label="Restart">Restart</button>
   </header>

   <main>
     <!-- Size is set dynamically by JS; start with a small default -->
     <canvas id="board" width="300" height="400"></canvas>
   </main>

   <!-- One-row controls -->
   <div class="pad" aria-label="On-screen controller">
     <button id="btnLeft"  class="btn" aria-label="Left">◀</button>
     <button id="btnUp"    class="btn" aria-label="Up">▲</button>
     <button id="btnDown"  class="btn" aria-label="Down">▼</button>
     <button id="btnRight" class="btn" aria-label="Right">▶</button>
   </div>
 </div>

 <!-- Overlay -->
 <div id="overlay">
   <div class="card">
     <h1 id="overlayTitle">Snake</h1>
     <p id="overlayMsg">Eat red food. Avoid poison. Golden is rare (+5 & +5 length). Survive 60 seconds!</p>
     <div class="row">
       <button id="startBtn" class="btn" style="background:#22c55e; box-shadow:0 6px 0 #138a3d;">Start</button>
       <button id="overlayRestartBtn" class="btn">Restart</button>
     </div>
     <p class="ghost">Controls: buttons below, or Arrow keys / WASD.</p>
   </div>
 </div>
<!-- Firebase (modular v10 CDN) -->
 <script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
   import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

   /* 1) PASTE YOUR CONFIG HERE */
   const firebaseConfig = {
     apiKey: "YOUR_API_KEY",
     authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
     projectId: "YOUR_PROJECT_ID",
     storageBucket: "YOUR_PROJECT_ID.appspot.com",
     messagingSenderId: "YOUR_SENDER_ID",
     appId: "YOUR_APP_ID"
   };

   let db = null;
   try {
     const app = initializeApp(firebaseConfig);
     db = getFirestore(app);
     console.log("Firebase initialized");
   } catch (e) {
     console.warn("Firebase not configured or blocked; scores won't be saved.", e);
   }

   /* ---------- Game (auto-fit, no scroll) ---------- */
   const canvas = document.getElementById('board');
   const ctx = canvas.getContext('2d');
   const scoreEl = document.getElementById('score');
   const timeEl  = document.getElementById('time');
   const overlay = document.getElementById('overlay');
   const overlayTitle = document.getElementById('overlayTitle');
   const overlayMsg   = document.getElementById('overlayMsg');
   const startBtn = document.getElementById('startBtn');
   const overlayRestartBtn = document.getElementById('overlayRestartBtn');
   const restartBtn = document.getElementById('restartBtn');

   const btnUp = document.getElementById('btnUp');
   const btnDown = document.getElementById('btnDown');
   const btnLeft = document.getElementById('btnLeft');
   const btnRight = document.getElementById('btnRight');

   /* Grid */
   const CELL = 10;          // size per cell
   let COLS = canvas.width / CELL;
   let ROWS = canvas.height / CELL;

   /* Colors */
   const COL = { bg:"#327aa8", snake:"#00ff00", food:"#d53250", poison:"#a020f0", gold:"#ffd700", ob:"#a9a9a9" };

   /* Timing */
   const TICK_HZ = 15;
   const TICK_MS = 1000 / TICK_HZ;
   const ROUND_LIMIT = 60;

   const POISON_VISIBLE_SECS = 3.0;
   const POISON_HIDDEN_SECS  = 1.0;
   const GOLDEN_LIFE = 5.0;

   let running = false;
   let roundStart = null;
   let lastTick = 0, acc = 0;

   let snake, snakeLen, dir, nextDir, score, food, poison, poisonStart, golden, goldenStart, obstacles;

   const same = (a, b) => a.x === b.x && a.y === b.y;
   const randCell = () => ({ x: Math.floor(Math.random()*COLS)*CELL,
                             y: Math.floor(Math.random()*ROWS)*CELL });

   function generateSafeObstacle() {
     const blocked = new Set();
     snake.forEach(s => blocked.add(`${s.x},${s.y}`));
     blocked.add(`${food.x},${food.y}`);
     if (golden) blocked.add(`${golden.x},${golden.y}`);
     poison.forEach(p => blocked.add(`${p.x},${p.y}`));
     while (true) {
       const c = randCell();
       if (!blocked.has(`${c.x},${c.y}`)) return c;
     }
   }

   function reset() {
     running = false; roundStart = null; lastTick = 0; acc = 0;

     const cx = Math.floor(COLS/2)*CELL;
     const cy = Math.floor(ROWS/2)*CELL;

     snake = [{x: cx, y: cy}];
     snakeLen = 1;
     dir = {x:0,y:0};
     nextDir = {x:0,y:0};
     score = 0;
     food = randCell();

     poison = [randCell(), randCell(), randCell(), randCell()];
     poisonStart = performance.now();

     golden = null; goldenStart = null;
     obstacles = [];

     scoreEl.textContent = "Score: 0";
     timeEl.textContent = "Time: 60";

     drawAll();
     showOverlay("Snake", "Eat red food. Avoid poison. Golden is rare (+5 & +5 length). Survive 60 seconds!");
   }

   function showOverlay(title, msg){ overlayTitle.textContent = title; overlayMsg.textContent = msg; overlay.style.display = "flex"; }
   function hideOverlay(){ overlay.style.display = "none"; }

   /* ----- Auto-resize canvas to fit without scrolling ----- */
   function resizeCanvas() {
     const headerH = document.querySelector('header').offsetHeight;
     const padH = document.querySelector('.pad').offsetHeight;
     const vw = window.innerWidth;
     const vh = window.innerHeight;

     // Remaining vertical space for canvas (include small margin)
     const margin = 14;
     const availableH = Math.max(140, vh - headerH - padH - margin);
     const availableW = Math.max(140, vw - 20);

     // Keep 3:4 ratio (W:H = 3:4)
     let w = Math.min(availableW, availableH * 3/4);
     let h = w * 4/3;

     // Snap to CELL multiples for crisp grid
     w = Math.floor(w / CELL) * CELL;
     h = Math.floor(h / CELL) * CELL;

     canvas.style.width  = w + "px";
     canvas.style.height = h + "px";
     canvas.width  = w;
     canvas.height = h;

     COLS = w / CELL;
     ROWS = h / CELL;

     // If game not running, redraw idle board at new size
     if (!running) drawAll();
   }

   window.addEventListener('resize', () => { resizeCanvas(); });

   /* Drawing */
   function drawCell(c, color){ ctx.fillStyle = color; ctx.fillRect(c.x, c.y, CELL, CELL); }
   function drawAll(){
     ctx.fillStyle = COL.bg;
     ctx.fillRect(0,0,canvas.width,canvas.height);

     drawCell(food, COL.food);

     // Poison visible/hidden cycle
     const now = performance.now();
     const t = (now - poisonStart) / 1000;
     const cycle = POISON_VISIBLE_SECS + POISON_HIDDEN_SECS;
     const phase = t % cycle;
     const showPoison = phase <= POISON_VISIBLE_SECS;
     if (showPoison) { poison.forEach(p => drawCell(p, COL.poison)); }
     else if (phase < 0.05) { poison = [randCell(), randCell(), randCell(), randCell()]; }

     if (golden) {
       drawCell(golden, COL.gold);
       if ((now - goldenStart)/1000 > GOLDEN_LIFE) golden = null;
     }

     obstacles.forEach(o => drawCell(o, COL.ob));
     snake.forEach(s => drawCell(s, COL.snake));
   }

   /* Tick */
   function tick(){
     if (!roundStart && (nextDir.x !== 0 || nextDir.y !== 0)) roundStart = performance.now();

     // prevent 180° reverse
     if (snake.length < 2 ||
         (snake[snake.length-1].x + nextDir.x !== snake[snake.length-2].x ||
          snake[snake.length-1].y + nextDir.y !== snake[snake.length-2].y)) {
       dir = {...nextDir};
     }

     const head = snake[snake.length-1];
     const nx = head.x + dir.x;
     const ny = head.y + dir.y;
     const newHead = {x:nx,y:ny};

     if (nx < 0 || nx >= canvas.width || ny < 0 || ny >= canvas.height) { endRound(); return; }

     snake.push(newHead);
     while (snake.length > snakeLen) snake.shift();

     for (let i=0;i<snake.length-1;i++){ if (same(snake[i], newHead)) { endRound(); return; } }
     for (const o of obstacles){ if (same(o, newHead)) { endRound(); return; } }

     if (!golden && Math.random() <= 0.03) { golden = randCell(); goldenStart = performance.now(); }

     if (same(newHead, food)) {
       food = randCell();
       snakeLen += 1;
       score += 1;
       scoreEl.textContent = "Score: " + score;
       obstacles.push(generateSafeObstacle());
     }

     const now = performance.now();
     const t = (now - poisonStart)/1000;
     const cycle = POISON_VISIBLE_SECS + POISON_HIDDEN_SECS;
     const phase = t % cycle;
     const showPoison = phase <= POISON_VISIBLE_SECS;
     if (showPoison) {
       for (let i=poison.length-1;i>=0;i--){
         if (same(poison[i], newHead)) {
           poison.splice(i,1);
           score = Math.max(0, score - 2);
           scoreEl.textContent = "Score: " + score;
         }
       }
     }

     if (golden && same(golden, newHead)) {
       score += 5; snakeLen += 5; scoreEl.textContent = "Score: " + score;
       for (let i=0;i<5;i++) obstacles.push(generateSafeObstacle());
       golden = null;
     }

     if (roundStart) {
       const elapsed = (performance.now() - roundStart)/1000;
       const remain = Math.max(0, ROUND_LIMIT - Math.floor(elapsed));
       timeEl.textContent = "Time: " + remain;
       if (elapsed >= ROUND_LIMIT) { endRound(); return; }
     }

     drawAll();
   }

   function loop(ts){
     if (!running) return;
     if (!lastTick) lastTick = ts;
     const dt = ts - lastTick; lastTick = ts; acc += dt;
     while (acc >= TICK_MS) { tick(); acc -= TICK_MS; if (!running) return; }
     requestAnimationFrame(loop);
   }

   async function endRound(){
     running = false;
     drawAll();
     showOverlay("Game Over", `Your Score: ${score}`);
     if (db) {
       try {
         await addDoc(collection(db, "scores"), {
           game: "snake",
           score: score,
           created_at: serverTimestamp()
         });
       } catch (e) { console.warn("Failed to save score:", e); }
     }
   }

   /* Controls */
   function setDir(x,y){ nextDir = {x,y}; }
   const pressHandlers = [
     [btnUp,    () => setDir(0,-CELL)],
     [btnDown,  () => setDir(0, CELL)],
     [btnLeft,  () => setDir(-CELL,0)],
     [btnRight, () => setDir( CELL,0)],
   ];
   for (const [el, fn] of pressHandlers) {
     el.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, {passive:false});
     el.addEventListener('mousedown',   e => { e.preventDefault(); fn(); });
   }
   window.addEventListener('keydown', e => {
     switch (e.key){
       case "ArrowUp": case "w": case "W": setDir(0,-CELL); break;
       case "ArrowDown": case "s": case "S": setDir(0, CELL); break;
       case "ArrowLeft": case "a": case "A": setDir(-CELL,0); break;
       case "ArrowRight": case "d": case "D": setDir( CELL,0); break;
     }
   });

   function startGame(){ hideOverlay(); running = true; lastTick = 0; acc = 0; requestAnimationFrame(loop); }
   restartBtn.addEventListener('click', () => { reset(); startGame(); });
   overlayRestartBtn.addEventListener('click', () => { reset(); startGame(); });
   startBtn.addEventListener('click', () => { reset(); startGame(); });

   // Init
   resizeCanvas();   // size to viewport first
   reset();          // draw idle state
 </script>
</body>
</html>
