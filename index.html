<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta
   name="viewport"
   content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
 />
 <title>Snake — Web</title>

 <!-- Pyodide (runs main.py in the browser) -->
 <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

 <!-- Firebase v10 (ESM) -->
 <script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
   import {
     getFirestore, doc, setDoc, serverTimestamp
   } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

   // 🔧 PUT YOUR OWN CONFIG HERE (same one you already use)
const firebaseConfig = {
  apiKey: "AIzaSyCB1IQNSy8pGFXgv9S1P4f0sTLyPxiUv9k",
  authDomain: "snake-web-b6745.firebaseapp.com",
  projectId: "snake-web-b6745",
  storageBucket: "snake-web-b6745.firebasestorage.app",
  messagingSenderId: "242732126109",
  appId: "1:242732126109:web:1d44c9bf8371f238792974"
};

   // Safe init (prevents “app already exists” on reloads)
   const app = (globalThis.firebase_app)
     ? globalThis.firebase_app
     : (globalThis.firebase_app = initializeApp(firebaseConfig));

   // Expose minimal Firestore helpers to Python (Pyodide sees them on `js`)
   if (!globalThis.firebase_firestore) {
     globalThis.firebase_firestore = { getFirestore, doc, setDoc, serverTimestamp };
   }
   if (!globalThis._snake_db) {
     globalThis._snake_db = getFirestore(app);
   }
 </script>

 <style>
   :root { --panel: #245b74; --ink: #e8f6ff; --pop: #ffef84; }
   * { box-sizing: border-box; }

   body {
     margin: 0; background:#12313f; color: var(--ink);
     font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, Noto Sans, "Apple Color Emoji", "Segoe UI Emoji";
     height: 100dvh; display: grid; place-items: center;
   }

   .wrapper {
     width: min(92vw, 720px);
     display: grid; gap: 10px;
     grid-template-rows: auto auto 1fr auto;
     align-items: center;
   }

   /* Top HUD row (left: score/time/player from game canvas; right: speed text) */
   .hud {
     display:flex; align-items:center; justify-content:space-between;
     padding: 6px 10px; background: rgba(0,0,0,.2); border-radius: 8px;
   }
   #hud-speed { font-weight: 700; }

   /* Canvas container (your pygame canvas will appear inside automatically) */
   .stage {
     position: relative; background: #1f5269;
     padding: 8px; border-radius: 10px; display:grid; place-items:center;
     min-height: 420px;
   }

   /* “Speed Up!” popup overlay */
   #speed-popup {
     position: absolute; inset: 0; display: grid; place-items:center;
     pointer-events:none; opacity:0; transition: opacity .2s ease;
   }
   #speed-popup.show { opacity: 1; }
   #speed-popup .bubble {
     padding: 10px 16px; border-radius: 10px;
     background: rgba(0,0,0,.55);
     border: 2px solid var(--pop);
     font-size: 24px; font-weight: 800; color: var(--pop);
     text-shadow: 0 2px 0 rgba(0,0,0,.35);
   }

   /* Controls row (simple D-pad; fires keyboard events) */
   .controls {
     display:flex; justify-content:center; gap:10px; margin-top: 2px;
   }
   .btn {
     border:0; padding:14px 16px; border-radius:12px;
     background:#2aa4d6; color:white; font-size:20px; font-weight:700;
     box-shadow: inset 0 -2px 0 rgba(0,0,0,.2);
     touch-action: manipulation; user-select:none;
   }
   .btn:active { transform: translateY(1px); }

   .topbar {
     display:flex; gap:8px; justify-content:flex-end;
   }
   .small { font-size: 12px; opacity: .75; }
 </style>
</head>
<body>
 <div class="wrapper">
   <!-- top bar -->
   <div class="topbar">
     <button class="btn" onclick="location.href='scoreboard.html'">Scoreboard</button>
     <button class="btn" onclick="location.reload()">Restart</button>
   </div>

   <!-- HUD row -->
   <div class="hud">
     <div class="small">Tip: get 5 points to speed up!</div>
     <div id="hud-speed">Speed ×1.0</div>
   </div>

   <!-- stage / canvas host -->
   <div class="stage">
     <!-- PyGame (Pyodide) will insert the <canvas> here automatically -->
     <div id="speed-popup"><div class="bubble">Speed Up! ×1.0</div></div>
   </div>

   <!-- Controls -->
   <div class="controls">
     <button class="btn" onclick="sendKey('ArrowLeft')">◀</button>
     <button class="btn" onclick="sendKey('ArrowUp')">▲</button>
     <button class="btn" onclick="sendKey('ArrowDown')">▼</button>
     <button class="btn" onclick="sendKey('ArrowRight')">▶</button>
   </div>
 </div>

 <script>
   // Dispatch virtual key events so pygame can read them
   function sendKey(key) {
     window.dispatchEvent(new KeyboardEvent('keydown', { key }));
   }
 </script>

 <!-- Boot Pyodide and run main.py -->
 <script>
   async function boot() {
     const pyodide = await loadPyodide();
     // make DOM helpers visible to Python
     globalThis._snake_set_speed_text = (txt) => {
       const el = document.getElementById('hud-speed');
       if (el) el.textContent = txt;
     };
     globalThis._snake_show_speed_popup = (txt, show) => {
       const cont = document.getElementById('speed-popup');
       const bubble = cont?.querySelector('.bubble');
       if (!cont || !bubble) return;
       bubble.textContent = `Speed Up! ${txt}`;
       cont.classList.toggle('show', !!show);
     };

     const code = await (await fetch("main.py")).text();
     // Run python (async because pygame loop yields on time.sleep)
     await pyodide.runPythonAsync(code);
   }
   boot();
 </script>
</body>
</html>
